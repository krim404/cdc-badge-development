name: Emulator

# Codeberg/Forgejo mirror of the GitHub `emulator` job: build the off-device
# emulator headlessly, run its unit + snapshot tests, then run the whole
# vendored example set and upload the binary as an artifact.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  emulator:
    runs-on: codeberg-medium

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install the C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 python3-venv git ca-certificates curl

      - name: Fetch the nested firmware submodules the emulator compiles
        run: >
          git -C vendor/cdc-badge-os submodule update --init
          components/Adafruit-GFX components/CalEPD
          components/wamr_runtime/wasm-micro-runtime

      - name: Bootstrap the plugin toolchain (rust + wasm-opt)
        run: python3 scripts/setup.py

      - name: Configure and build the emulator (headless, static runtime)
        run: |
          cmake -S emulator -B emulator/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DEMULATOR_STATIC_RUNTIME=ON \
            -DEMULATOR_WINDOW=OFF
          cmake --build emulator/build --parallel

      - name: Build the snapshot test plugin
        run: |
          python3 tools/badge.py build canvas_demo
          python3 tools/badge.py build mini_messenger

      - name: Run the emulator test suite
        run: ctest --test-dir emulator/build --output-on-failure

      - name: Run the whole example set headlessly
        run: python3 emulator/tests/run_examples.py

      - name: Upload the emulator binary
        uses: actions/upload-artifact@v7
        with:
          name: cdc-badge-emulator-linux-x86_64
          path: emulator/build/cdc-badge-emulator
