name: verify

# Cross-platform verification. This is the stand-in for manually testing
# Windows: every push builds and tests the example plugin on Windows, macOS and
# Linux, so a regression on any OS turns the run red.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # First level only. We need the SDK and firmware docs/tools, NOT the
          # firmware's heavy nested submodules (WAMR, libtropic, ...), one of
          # which has a path too long for a Windows checkout.
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap the toolchain (host-native, same on every OS)
        run: python scripts/setup.py

      - name: Build the example plugin
        run: python tools/badge.py build starter

      - name: Run the example plugin's host tests
        run: python tools/badge.py test starter

  emulator:
    name: emulator (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Allow long submodule paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch the nested firmware submodules the emulator compiles
        run: >
          git -C vendor/cdc-badge-os submodule update --init
          components/Adafruit-GFX components/CalEPD
          components/wamr_runtime/wasm-micro-runtime

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap the toolchain (rust + wasm-opt for the test plugin)
        run: python scripts/setup.py

      - name: Use MinGW GCC on Windows (the vendored firmware is GCC-only code)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'EMU_CMAKE_FLAGS=-G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++' >> "$GITHUB_ENV"

      - name: Configure and build the emulator (headless)
        shell: bash
        run: |
          cmake -S emulator -B emulator/build $EMU_CMAKE_FLAGS -DEMULATOR_WINDOW=OFF
          cmake --build emulator/build --parallel

      - name: Build the snapshot test plugin
        run: |
          python tools/badge.py build canvas_demo
          python tools/badge.py build mini_messenger

      - name: Run the emulator test suite (unit + snapshot regression)
        run: ctest --test-dir emulator/build --output-on-failure

      - name: Run the whole example set headlessly (no emulator crashes)
        run: python emulator/tests/run_examples.py
